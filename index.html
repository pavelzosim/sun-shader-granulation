<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Granulation | UE 5.7 Procedural Demo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/pavelzosim/atlas-framework@1b94ccf8eceef058d93848d15ee6551dc61bdf26/cdn/atlas-framework.css">
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #050505; 
        }

        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .atlas-ui-wrapper {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 100;
            width: 340px;
            pointer-events: none;
        }

        .atlas-shader-panel {
            pointer-events: auto;
        }

        /* Делаем заголовок кликабельным, чтобы разворачивать панель */
        .atlas-shader-panel__header {
            cursor: pointer;
            user-select: none;
        }

        /* Когда панель свернута — прячем тело и подвал */
        .atlas-shader-panel.is-collapsed .atlas-shader-panel__body,
        .atlas-shader-panel.is-collapsed .atlas-shader-panel__footer {
            display: none !important;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="atlas-container atlas-ui-wrapper">
        <div class="atlas-shader-panel" id="ui-panel">
            
            <!-- Клик по хэдеру развернет панель обратно -->
            <div class="atlas-shader-panel__header" id="ui-header" title="Click to expand">
                <div class="atlas-shader-panel__title">Granulation Settings</div>
                <div class="atlas-shader-panel__status">
                    <div class="atlas-shader-panel__led"></div>
                    ACTIVE
                </div>
            </div>

            <div class="atlas-shader-panel__body">
                <div class="atlas-shader-panel__block">
                    <div class="atlas-shader-panel__block-title">
                        Sun Surface Parameters
                        <span class="atlas-shader-panel__block-hint">GLSL</span>
                    </div>

                    <div class="atlas-sp-grid">
                        
                        <div class="atlas-sp-prefix">val_</div>
                        <div class="atlas-sp-label">GranuleScale</div>
                        <div class="atlas-sp-value" id="val-granuleScale">1.00</div>
                        <div class="atlas-sp-slider-wrap atlas-sp-row-full">
                            <input type="range" class="atlas-sp-slider" id="granuleScale" min="0.5" max="5.0" step="0.01" value="1.00">
                        </div>

                        <div class="atlas-sp-prefix">val_</div>
                        <div class="atlas-sp-label">WarpAmount</div>
                        <div class="atlas-sp-value" id="val-warpAmount">0.18</div>
                        <div class="atlas-sp-slider-wrap atlas-sp-row-full">
                            <input type="range" class="atlas-sp-slider" id="warpAmount" min="0.0" max="1.0" step="0.01" value="0.18">
                        </div>

                        <div class="atlas-sp-prefix">val_</div>
                        <div class="atlas-sp-label">BoilSpeed</div>
                        <div class="atlas-sp-value" id="val-boilSpeed">1.00</div>
                        <div class="atlas-sp-slider-wrap atlas-sp-row-full">
                            <input type="range" class="atlas-sp-slider" id="boilSpeed" min="0.0" max="4.0" step="0.01" value="1.00">
                        </div>

                        <div class="atlas-sp-prefix">val_</div>
                        <div class="atlas-sp-label">CellExponent</div>
                        <div class="atlas-sp-value" id="val-cellExponent">2.50</div>
                        <div class="atlas-sp-slider-wrap atlas-sp-row-full">
                            <input type="range" class="atlas-sp-slider" id="cellExponent" min="1.0" max="5.0" step="0.01" value="2.50">
                        </div>

                    </div>
                </div>
                
                <div class="atlas-sp-actions">
                    <div class="atlas-sp-btn-wrap">
                        <!-- ЗАМЕНИЛИ FLUSH НА КНОПКУ СВЕРНУТЬ -->
                        <button class="atlas-sp-btn atlas-sp-btn--reset" id="collapse-btn">
                            <span class="atlas-sp-btn__icon">⤌</span> Collapse Panel
                        </button>
                    </div>
                </div>
            </div>

            <div class="atlas-shader-panel__footer">
                <div class="atlas-shader-panel__footer-col">
                    <div class="atlas-sp-meta-line"><span class="atlas-sp-meta-key">SRC:</span>SunGranulation.ush</div>
                </div>
                <div class="atlas-shader-panel__footer-col atlas-shader-panel__footer-col--right">
                    <div class="atlas-sp-meta-line"><span class="atlas-sp-meta-key">ENV:</span>UE 5.7</div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, mesh, material;
        const startTime = Date.now();

        const _VS = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const _FS = `
            precision highp float;
            uniform float time;
            uniform float granuleScale;
            uniform float warpAmount;
            uniform float boilSpeed;
            uniform float cellExponent;
            varying vec2 vUv;

            vec2 hash22(vec2 p) {
                p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
                return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
            }

            float noise(vec2 p) {
                const float K1 = 0.366025404;
                const float K2 = 0.211324865;
                vec2 i = floor(p + (p.x + p.y) * K1);
                vec2 a = p - i + (i.x + i.y) * K2;
                vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec2 b = a - o + K2;
                vec2 c = a - 1.0 + 2.0 * K2;
                vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
                vec3 n = h * h * h * h * vec3(dot(a, hash22(i + 0.0)), dot(b, hash22(i + o)), dot(c, hash22(i + 1.0)));
                return dot(n, vec3(70.0));
            }

            vec2 curlNoise(vec2 p) {
                const float e = 0.01;
                float n = noise(p);
                float dx = (noise(p + vec2(e, 0.0)) - n) / e;
                float dy = (noise(p + vec2(0.0, e)) - n) / e;
                return vec2(dy, -dx);
            }

            vec2 voronoi(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                float F1 = 8.0, F2 = 8.0;

                for (int y = -1; y <= 1; y++) {
                    for (int x = -1; x <= 1; x++) {
                        vec2 g = vec2(float(x), float(y));
                        vec2 o = hash22(i + g);
                        o = 0.5 + 0.5 * sin(time * boilSpeed * 1.5 + 6.2831 * o);
                        vec2 r = g + o - f;
                        float d = dot(r, r);

                        if (d < F1) {
                            F2 = F1;
                            F1 = d;
                        } else if (d < F2) {
                            F2 = d;
                        }
                    }
                }
                return sqrt(vec2(F1, F2));
            }

            vec3 getSunColor(float t) {
                t = clamp(t, 0.0, 1.0);
                vec3 c1 = vec3(0.08, 0.0, 0.0); 
                vec3 c2 = vec3(1.0, 0.25, 0.0); 
                vec3 c3 = vec3(1.0, 0.75, 0.1); 
                vec3 c4 = vec3(1.0, 1.0, 0.95); 
                
                vec3 color = mix(c1, c2, smoothstep(0.0, 0.25, t));
                color = mix(color, c3, smoothstep(0.25, 0.6, t));
                color = mix(color, c4, smoothstep(0.6, 1.0, t));
                return color;
            }

            void main() {
                vec2 p = (vUv - 0.5) * 15.0 * granuleScale;
                vec2 warpP = p * 0.4 + time * boilSpeed * 0.2;
                vec2 curl = curlNoise(warpP);
                vec2 warpedP = p + curl * warpAmount;

                float tOffset = time * boilSpeed * 0.1;
                vec2 finalP = warpedP + vec2(tOffset * 0.7, tOffset * 0.3);
                vec2 vData = voronoi(finalP);
                float F1 = vData.x;
                float F2 = vData.y;

                float cell = pow(max(1.0 - F1, 0.0), cellExponent);
                float lane = clamp((F2 - F1) * 3.0, 0.0, 1.0);
                float finalBright = cell + lane * 0.05;

                gl_FragColor = vec4(getSunColor(finalBright), 1.0);
            }
        `;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.Camera(); 

            const canvasElement = document.getElementById('webgl-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.setSize(window.innerWidth, window.innerHeight);

            const geometry = new THREE.PlaneGeometry(2, 2);
            
            material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    granuleScale: { value: 1.0 },
                    warpAmount: { value: 0.18 },
                    boilSpeed: { value: 1.0 },
                    cellExponent: { value: 2.5 }
                },
                vertexShader: _VS,
                fragmentShader: _FS
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            window.addEventListener('resize', onWindowResize, false);
            setupUI();
            animate();
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.time.value = (Date.now() - startTime) * 0.001;
            renderer.render(scene, camera);
        }

        function setupUI() {
            const params = ['granuleScale', 'warpAmount', 'boilSpeed', 'cellExponent'];
            params.forEach(id => {
                const el = document.getElementById(id);
                const display = document.getElementById('val-' + id);
                el.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    display.innerText = val.toFixed(2);
                    material.uniforms[id].value = val;
                });
            });

            // Логика сворачивания
            const uiPanel = document.getElementById('ui-panel');
            const collapseBtn = document.getElementById('collapse-btn');
            const uiHeader = document.getElementById('ui-header');

            // Кнопка снизу сворачивает panel
            collapseBtn.addEventListener('click', () => {
                uiPanel.classList.add('is-collapsed');
            });

            // Клик по шапке разворачивает её обратно
            uiHeader.addEventListener('click', () => {
                uiPanel.classList.remove('is-collapsed');
            });
        }

        init();
    </script>
</body>
</html>
